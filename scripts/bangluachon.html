<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Để tôi đỗ đại học · Bảng lựa chọn</title>
    <style>
        /* ============================================================
               Bảng lựa chọn · Dành riêng cho Vương Xuân Phượng
               Chữ màu đen rõ ràng tương phản cao trên nền giấy Tuyên
               Phục cổ kiểu Trung · Phong cách giấy viết thư xưa
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --paper: 45, 18%, 88%;
            --paper-dark: 42, 15%, 78%;
            --ink: 0, 0%, 0%; /* Đen thuần chuẩn nét */
            --ink-light: 0, 0%, 20%;
            --cinnabar: 350, 55%, 40%;
            --cinnabar-light: 350, 45%, 55%;
            --old-gold: 38, 45%, 50%;
            --old-gold-light: 38, 35%, 65%;
            --bg-dark: 0, 0%, 6%;
        }

        .options-module {
            width: 100%;
            max-width: 620px;
            margin: 1.2rem auto;
            background: hsla(var(--paper), 0.92);
            background-image: url('【Thay thế bằng link ảnh nền của bảng lựa chọn tại đây】');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1.5px solid hsla(var(--cinnabar), 0.25);
            border-radius: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 0 0 1px hsla(var(--old-gold), 0.06);
            padding: 18px 18px 16px;
            font-family: 'Noto Serif SC', 'Inter', 'PingFang SC', serif;
            color: #000000;
            position: relative;
            min-height: 60px;
            transition: all 0.3s ease;
        }

        /* Hoa văn hồi văn bốn góc */
        .options-module .corner-border {
            position: absolute;
            width: 18px;
            height: 18px;
            z-index: 2;
            pointer-events: none;
        }
        .options-module .corner-border::before,
        .options-module .corner-border::after {
            content: '';
            position: absolute;
            background: hsla(var(--cinnabar), 0.08);
            border: 1px solid hsla(var(--cinnabar), 0.04);
        }
        .corner-tl { top: 6px; left: 6px; }
        .corner-tl::before { top: 0; left: 0; width: 8px; height: 3px; border-bottom: none; border-right: none; }
        .corner-tl::after { bottom: 0; right: 0; width: 3px; height: 8px; border-top: none; border-left: none; }
        .corner-tr { top: 6px; right: 6px; }
        .corner-tr::before { top: 0; right: 0; width: 8px; height: 3px; border-bottom: none; border-left: none; }
        .corner-tr::after { bottom: 0; left: 0; width: 3px; height: 8px; border-top: none; border-right: none; }
        .corner-bl { bottom: 6px; left: 6px; }
        .corner-bl::before { bottom: 0; left: 0; width: 8px; height: 3px; border-top: none; border-right: none; }
        .corner-bl::after { top: 0; right: 0; width: 3px; height: 8px; border-bottom: none; border-left: none; }
        .corner-br { bottom: 6px; right: 6px; }
        .corner-br::before { bottom: 0; right: 0; width: 8px; height: 3px; border-top: none; border-left: none; }
        .corner-br::after { top: 0; left: 0; width: 3px; height: 8px; border-bottom: none; border-right: none; }

        .options-module>* {
            position: relative;
            z-index: 1;
        }

        /* Đường trang trí phía trên */
        .header-deco {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.08);
            position: relative;
        }
        .header-deco .line-left,
        .header-deco .line-right {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, hsla(var(--cinnabar), 0.15) 30%, hsla(var(--cinnabar), 0.15) 70%,
                    transparent);
        }
        .header-deco .diamond {
            width: 5px;
            height: 5px;
            background: hsla(var(--cinnabar), 0.12);
            transform: rotate(45deg);
            flex-shrink: 0;
            border: 1px solid hsla(var(--cinnabar), 0.04);
        }
        .header-deco .dot {
            width: 2.5px;
            height: 2.5px;
            border-radius: 50%;
            background: hsla(var(--cinnabar), 0.08);
            flex-shrink: 0;
        }

        .options-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.08);
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .options-header .options-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .options-header .options-title .seal {
            font-size: 8px;
            background: hsla(var(--cinnabar), 0.08);
            border: 1px solid hsla(var(--cinnabar), 0.18);
            padding: 0 8px;
            border-radius: 2px;
            letter-spacing: 2px;
            color: #000000;
            font-weight: 600;
        }
        
        /* Bộ điều khiển chế độ Gửi / Ghi Input */
        .options-control-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mode-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: hsla(var(--paper-dark), 0.35);
            border: 1px solid hsla(var(--cinnabar), 0.2);
            border-radius: 12px;
            padding: 2px 8px 2px 4px;
            font-size: 9px;
            color: #111111;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            font-family: inherit;
        }
        .mode-toggle-btn:hover {
            background: hsla(var(--cinnabar), 0.1);
            border-color: hsla(var(--cinnabar), 0.35);
        }
        .mode-switch-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: hsl(var(--cinnabar));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            color: #ffffff;
            font-size: 8px;
        }
        .mode-toggle-btn.input-only {
            background: hsla(var(--old-gold), 0.15);
            border-color: hsla(var(--old-gold), 0.4);
        }
        .mode-toggle-btn.input-only .mode-switch-dot {
            background: hsl(var(--old-gold));
        }

        .options-hint {
            font-size: 9px;
            color: #333333;
            letter-spacing: 1px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        /* Lưới tùy chọn */
        .options-inner {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 2px 0;
        }

        .opt-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 6px;
            background: hsla(var(--paper-dark), 0.25);
            border: 1px solid hsla(var(--cinnabar), 0.15);
            border-radius: 2px;
            color: #000000;
            font-family: 'Noto Serif SC', 'Inter', 'PingFang SC', serif;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.4;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            gap: 3px;
            position: relative;
        }
        .opt-btn .badge {
            font-size: 9px;
            font-weight: 700;
            color: #222222;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        .opt-btn:hover {
            background: hsla(var(--cinnabar), 0.08);
            border-color: hsla(var(--cinnabar), 0.35);
            color: #000000;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .opt-btn:hover .badge {
            color: #000000;
        }
        .opt-btn:active {
            transform: scale(0.95) translateY(0);
            transition-duration: 0.05s;
        }
        .opt-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
            transform: none !important;
        }

        .options-empty {
            color: #444444;
            font-size: 10px;
            letter-spacing: 3px;
            text-align: center;
            width: 100%;
            padding: 12px 0;
            grid-column: 1 / -1;
            font-weight: 500;
        }

        @media (max-width: 520px) {
            .options-inner {
                grid-template-columns: repeat(2, 1fr);
            }
            .options-module {
                padding: 14px 12px 12px;
                border-radius: 2px;
            }
            .options-header .options-title {
                font-size: 11px;
                letter-spacing: 1px;
            }
            .options-header .options-title .seal {
                font-size: 7px;
                padding: 0 6px;
            }
            .opt-btn {
                font-size: 10px;
                padding: 10px 4px;
            }
        }

        @media (max-width: 380px) {
            .options-inner {
                grid-template-columns: 1fr;
            }
            .opt-btn {
                flex-direction: row;
                justify-content: flex-start;
                padding: 8px 12px;
                text-align: left;
                gap: 8px;
            }
            .opt-btn .badge {
                font-size: 8px;
            }
            .options-module {
                padding: 10px 8px 10px;
            }
            .options-header .options-title {
                font-size: 9px;
                letter-spacing: 1px;
            }
        }

        @media (min-width: 600px) {
            .options-module {
                padding: 22px 22px 18px;
            }
            .opt-btn {
                font-size: 13px;
                padding: 14px 8px;
            }
            .options-header .options-title {
                font-size: 15px;
            }
            .options-hint {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="options-module" id="options-root">

        <!-- Hoa văn hồi văn bốn góc -->
        <div class="corner-border corner-tl"></div>
        <div class="corner-border corner-tr"></div>
        <div class="corner-border corner-bl"></div>
        <div class="corner-border corner-br"></div>

        <!-- Đường trang trí phía trên -->
        <div class="header-deco">
            <span class="line-left"></span>
            <span class="diamond"></span>
            <span class="dot"></span>
            <span class="diamond"></span>
            <span class="dot"></span>
            <span class="diamond"></span>
            <span class="line-right"></span>
        </div>

        <!-- Phần đầu (Header) -->
        <div class="options-header">
            <div class="options-title">
                Chọn hành động
                <span class="seal">Vương Xuân Phượng</span>
            </div>
            
            <div class="options-control-wrap">
                <!-- Công tắc chuyển chế độ Ghi vào Input / Gửi trực tiếp -->
                <button class="mode-toggle-btn" id="mode-toggle" title="Nhấp để đổi chế độ">
                    <span class="mode-switch-dot" id="mode-icon">⚡</span>
                    <span id="mode-label">Gửi trực tiếp</span>
                </button>
                <div class="options-hint" id="options-hint">Nhấp để chọn</div>
            </div>
        </div>

        <!-- Danh sách tùy chọn -->
        <div class="options-inner" id="options-list"></div>
    </div>

    <!-- Container dữ liệu (Tương thích liên kết ngoài) -->
    <div id="options-data" style="display:none;">$1</div>

    <script>
        (function() {
            'use strict';

            var STORAGE_MODE_KEY = 'st_options_insert_only_mode';
            var isInsertOnly = false;

            try {
                var saved = localStorage.getItem(STORAGE_MODE_KEY);
                if (saved !== null) {
                    isInsertOnly = saved === 'true';
                }
            } catch (e) {}

            var dataContainer = document.getElementById('options-data');
            var raw = dataContainer ? dataContainer.textContent.trim() : '';
            var container = document.getElementById('options-list');
            var modeToggleBtn = document.getElementById('mode-toggle');
            var modeIcon = document.getElementById('mode-icon');
            var modeLabel = document.getElementById('mode-label');
            var optionsHint = document.getElementById('options-hint');

            if (!container) return;

            // Cập nhật giao diện công tắc
            function updateModeUI() {
                if (!modeToggleBtn || !modeLabel || !modeIcon) return;
                if (isInsertOnly) {
                    modeToggleBtn.classList.add('input-only');
                    modeIcon.textContent = '✍️';
                    modeLabel.textContent = 'Ghi vào ô nhập';
                    optionsHint.textContent = 'Chỉ điền ô chat';
                } else {
                    modeToggleBtn.classList.remove('input-only');
                    modeIcon.textContent = '⚡';
                    modeLabel.textContent = 'Gửi trực tiếp';
                    optionsHint.textContent = 'Tự động gửi';
                }
            }

            // Chuyển đổi qua lại giữa 2 chế độ
            if (modeToggleBtn) {
                modeToggleBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    isInsertOnly = !isInsertOnly;
                    try {
                        localStorage.setItem(STORAGE_MODE_KEY, String(isInsertOnly));
                    } catch (err) {}
                    updateModeUI();
                });
            }

            updateModeUI();

            // Lấy phần tử textarea của SillyTavern
            function getChatTextarea() {
                return document.querySelector('#send_textarea') ||
                    (window.parent && window.parent.document.querySelector('#send_textarea')) ||
                    document.querySelector('textarea');
            }

            // Ghi nội dung vào ô Input chat
            function writeToInput(text) {
                var textarea = getChatTextarea();
                if (textarea) {
                    textarea.value = text;
                    textarea.dispatchEvent(new Event('input', { bubbles: true }));
                    textarea.focus();
                    
                    if (optionsHint) {
                        var oldText = optionsHint.textContent;
                        optionsHint.textContent = 'Đã điền vào ô chat! ✨';
                        optionsHint.style.color = 'hsl(var(--old-gold))';
                        setTimeout(function() {
                            optionsHint.textContent = oldText;
                            optionsHint.style.color = '#333333';
                        }, 2000);
                    }
                } else {
                    console.warn('[Bảng lựa chọn] Không tìm thấy ô nhập #send_textarea');
                }
            }

            // Gửi trực tiếp đến Tavern
            function sendOption(text) {
                if (!text) return;
                if (typeof triggerSlash === 'function') {
                    triggerSlash('/send ' + text + '|/trigger');
                    return;
                }
                var textarea = getChatTextarea();
                if (textarea) {
                    textarea.value = text;
                    textarea.dispatchEvent(new Event('input', { bubbles: true }));
                    var sendBtn = document.querySelector('#send_button') || document.querySelector('#send_btn') ||
                        (window.parent && (window.parent.document.querySelector('#send_button') || window.parent.document.querySelector('#send_btn')));
                    if (sendBtn) {
                        setTimeout(function() { sendBtn.click(); }, 80);
                    }
                }
            }

            // Phân tích cú pháp: Dùng | để phân tách các tùy chọn
            var items = raw ? raw.split('|').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; }) : [];

            if (items.length === 0) {
                container.innerHTML = '<div class="options-empty">✦ Chờ lựa chọn ✦</div>';
                return;
            }

            // Hiển thị (Render) các nút lựa chọn
            var html = '';
            var badges = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
            items.forEach(function(opt, index) {
                var safeText = opt
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
                html += `
                        <button class="opt-btn" data-opt="${safeText}">
                            <span class="badge">${badges[index] || (index + 1)}</span>
                            <span>${safeText}</span>
                        </button>
                    `;
            });
            container.innerHTML = html;

            // Ràng buộc sự kiện click
            container.addEventListener('click', function(e) {
                var btn = e.target.closest('.opt-btn');
                if (!btn || btn.classList.contains('disabled')) return;

                var text = btn.getAttribute('data-opt');
                if (text) {
                    if (isInsertOnly) {
                        // Chế độ: Chỉ ghi vào ô chat
                        writeToInput(text);
                    } else {
                        // Chế độ: Gửi trực tiếp
                        document.querySelectorAll('.opt-btn').forEach(function(b) { b.classList.add('disabled'); });
                        sendOption(text);
                        setTimeout(function() {
                            document.querySelectorAll('.opt-btn').forEach(function(b) { b.classList.remove('disabled'); });
                        }, 4000);
                    }
                }
            });

            // Phản hồi chạm trên điện thoại
            container.addEventListener('touchstart', function(e) {
                var btn = e.target.closest('.opt-btn');
                if (!btn) return;
                btn.style.transition = 'none';
                btn.style.transform = 'scale(0.95)';
                setTimeout(function() {
                    btn.style.transition = '';
                    btn.style.transform = '';
                }, 100);
            }, { passive: true });

            console.log('📜 Bảng lựa chọn đã tải sẵn sàng kèm công tắc chế độ (Gửi trực tiếp / Ghi vào Input)');
        })();
    </script>

</body>
</html>
